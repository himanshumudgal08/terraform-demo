name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
          - all
        default: dev

env:
  TF_VERSION: 1.6.6

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        env: ${{ fromJson(github.event.inputs.environment == 'all' && '["dev","uat","prod"]' || format('["{0}"]', github.event.inputs.environment)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure SP environment variables
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | jq -r '. | to_entries | .[] | "ARM_\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
          sed -i 's/ARM_CLIENTID/ARM_CLIENT_ID/g' $GITHUB_ENV
          sed -i 's/ARM_CLIENTSECRET/ARM_CLIENT_SECRET/g' $GITHUB_ENV
          sed -i 's/ARM_TENANTID/ARM_TENANT_ID/g' $GITHUB_ENV
          sed -i 's/ARM_SUBSCRIPTIONID/ARM_SUBSCRIPTION_ID/g' $GITHUB_ENV

      - name: Terraform Init
        working-directory: code
        run: |
          terraform init \
            -backend-config=env/${{ matrix.env }}/backend.hcl

      - name: Run TFSec Security Scan
        run: |
          wget -qO tfsec https://github.com/aquasecurity/tfsec/releases/download/v1.28.1/tfsec-linux-amd64
          chmod +x tfsec
          ./tfsec code -f sarif -o tfsec.sarif || true

      - name: Upload TFSec results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('tfsec.sarif') != ''
        with:
          sarif_file: tfsec.sarif

      - name: Terraform Plan
        working-directory: code
        run: |
          terraform plan \
            -var-file=env/${{ matrix.env }}/terraform.tfvars \
            -out=tfplan-${{ matrix.env }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan-${{ matrix.env }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(github.event.inputs.environment == 'all' && '["dev","uat","prod"]' || format('["{0}"]', github.event.inputs.environment)) }}
    environment: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Azure SP environment variables
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "$AZURE_CREDENTIALS" | jq -r '. | to_entries | .[] | "ARM_\(.key | ascii_upcase)=\(.value)"' >> $GITHUB_ENV
          sed -i 's/ARM_CLIENTID/ARM_CLIENT_ID/g' $GITHUB_ENV
          sed -i 's/ARM_CLIENTSECRET/ARM_CLIENT_SECRET/g' $GITHUB_ENV
          sed -i 's/ARM_TENANTID/ARM_TENANT_ID/g' $GITHUB_ENV
          sed -i 's/ARM_SUBSCRIPTIONID/ARM_SUBSCRIPTION_ID/g' $GITHUB_ENV

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Apply Terraform
        working-directory: code
        run: |
          terraform apply -auto-approve tfplan-${{ matrix.env }}

