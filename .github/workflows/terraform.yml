name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
          - all
        default: dev

env:
  TF_VERSION: 1.6.6

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(github.event.inputs.environment == 'all' && '["dev","uat","prod"]' || format('["{0}"]', github.event.inputs.environment)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        working-directory: code
        run: |
          terraform init \
            -backend-config=env/${{ matrix.env }}/backend.hcl

      - name: Terraform Plan
        working-directory: code
        run: |
          terraform plan \
            -var-file=env/${{ matrix.env }}/terraform.tfvars \
            -out=tfplan-${{ matrix.env }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: tfplan-${{ matrix.env }}

  apply:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: ${{ fromJson(github.event.inputs.environment == 'all' && '["dev","uat","prod"]' || format('["{0}"]', github.event.inputs.environment)) }}
    environment: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: .

      - name: Apply Terraform
        working-directory: code
        run: |
          terraform apply -auto-approve tfplan-${{ matrix.env }}

